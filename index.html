<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz sobre Inteligência Artificial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="quiz-container">
    <h1>Quiz de IA</h1>
    
    <!-- Cartão da Pergunta -->
    <div id="quiz-box">
      <h2 id="question-text">A pergunta aparecerá aqui...</h2>
      <div id="options-container" class="options-grid">
        <!-- As opções serão inseridas dinamicamente via JS -->
      </div>
    </div>

    <!-- Tela de Resultado (Escondida inicialmente) -->
    <div id="result-box" class="hidden">
      <h2>Resultado Final</h2>
      <p id="score-text">Você acertou X de Y perguntas!</p>
      <button id="restart-btn" onclick="restartQuiz()">Tentar Novamente</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
